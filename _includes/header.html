<header class="site-header">
	<div class="site-header-inner">
		<a class="brand" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>
			<img class="brand-icon" src="{{ site.app_icon | relative_url }}" alt="" width="40" height="40">
			<span class="brand-name">{{ site.app_name }}</span>
		</a>
		<nav class="site-nav" aria-label="Site">
			<ul>
				{% for nav_page in site.pages %}
					{% if nav_page.include_in_header == true %}
					<li>
						<a href="{{ nav_page.url | relative_url }}" {% if page.url == nav_page.url %}aria-current="page"{% endif %}>{{ nav_page.title }}</a>
					</li>
					{% endif %}
				{% endfor %}
				<li>
					<a href="{{ '/privacypolicy/' | relative_url }}" {% if page.url == '/privacypolicy/' %}aria-current="page"{% endif %}>Privacy</a>
				</li>
			</ul>
		</nav>
	</div>
</header>
