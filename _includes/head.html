<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.page_title }}</title>
	<meta name="description" content="{% if site.app_tagline %}{{ site.app_tagline }} {% endif %}{{ site.app_description }}">
	<meta name="theme-color" content="#FAF7F2">

	<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.page_title }}">
	<meta property="og:description" content="{{ site.app_description }}">
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:image" content="{{ site.app_icon | absolute_url }}">

	<link rel="icon" href="{{ site.app_icon | relative_url }}">
	<link rel="apple-touch-icon" href="{{ site.app_icon | relative_url }}">

	{% if site.enable_smart_app_banner %}
	<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
