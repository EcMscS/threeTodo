<!DOCTYPE html>
<html lang="en-us" data-theme="paper" data-ios-app-id="{{ site.ios_app_id }}" data-ios-country="{{ site.ios_app_country }}">

{% include head.html %}

<body class="{% if page.url == '/' %}is-home{% else %}is-page{% endif %}">
	<a class="skip-link" href="#main">Skip to content</a>
	{% include header.html %}
	<main id="main">
		{{ content }}
	</main>
	{% include footer.html %}
	<script src="{{ '/assets/js/appstore.js' | relative_url }}" defer></script>
</body>
</html>
